# Solaris Health - Public URL: https://solaris-health.abacusai.cloud
# Symlinked to /etc/nginx/conf.d/solaris-health.conf
server {
    listen 80;
    server_name solaris-health.vm.internal;

    # Backend API — proxy to backend container
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-Host $http_x_original_host;
        proxy_http_version 1.1;
    }

    # Service worker must never be cached, so a new sw.js is always detected and the
    # network-first shell fix propagates immediately (prevents stale-shell blank screen).
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000/sw.js;
        proxy_set_header Host localhost;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Frontend SPA — proxy to Vite serve container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Don't cache the HTML so new JS bundles are always fetched
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
