# Solaris Investor Demo — PERMANENT synthetic demo custom domain.
# Public URL: https://demo.solarishealth.app → server_name demo.solarishealth.app (custom domain, Host arrives unchanged)
# Serves the SAME tested Vite SPA build + Express backend (127.0.0.1:5055) as solarishealth.app.
# NOTE: main (solarishealth.app) and demo TEMPORARILY SHARE the same synthetic
# InvestorDemoV1 DB — no data isolation between them for now.
server {
    listen 80;
    server_name demo.solarishealth.app;

    root /opt/solaris-beta-demo/current/dist;
    index index.html;

    add_header Cache-Control "max-age=0, s-maxage=60" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;

    # Operational metrics must NOT be reachable from public hostnames (they expose
    # row counts + process memory/uptime). Deny at the edge; the operator path is
    # localhost-only via the backend on 127.0.0.1:5055 directly on the VM.
    location = /api/metrics {
        return 404;
    }

    # API → Express backend (isolated demo instance).
    location /api {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
