# Solaris Investor Demo — PREVIEW custom subdomain (vhost staged on-VM; PENDING human domain attach).
# Public URL: https://preview.solarishealth.app → server_name preview.solarishealth.app
# NOTE: this subdomain is NOT yet routed to the VM. A human must attach it in
# Abacus Cloud Settings → Custom Domains → Manage (Destination = "Your SuperComputer").
# Until then this vhost receives no traffic; it is ready so the domain works the moment it is attached.
server {
    listen 80;
    server_name preview.solarishealth.app;

    root /tmp/solaris-beta-v1-investor-demo/dist;
    index index.html;

    add_header Cache-Control "max-age=0, s-maxage=60" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;

    # API → Express backend (isolated demo instance).
    location /api {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
