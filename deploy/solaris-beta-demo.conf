# Solaris Beta V1 — ISOLATED NON-PRODUCTION preview (investor demo branch).
# Public URL: https://solaris-beta-demo.abacusai.cloud → server_name solaris-beta-demo.vm.internal
# Full stack: static Vite SPA + Express backend (127.0.0.1:5055) + isolated demo DB.
server {
    listen 80;
    server_name solaris-beta-demo.vm.internal;

    root /opt/solaris-beta/current/dist;
    index index.html;

    add_header Cache-Control "max-age=0, s-maxage=60" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;

    # Operational metrics must NOT be reachable from public hostnames (they expose
    # row counts + process memory/uptime). Deny at the edge; the operator path is
    # localhost-only via the backend on 127.0.0.1:5055 directly on the VM.
    location = /api/metrics {
        return 404;
    }

    # API → Express backend (isolated demo instance).
    location /api {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
